<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Hotel Billing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style id="pageStyle"></style>
<style>
:root{
  --bg:#f4f6fa;--surface:#fff;--surface2:#f8fafc;--border:#e6e9f0;--text:#0f172a;--text2:#334155;--muted:#64748b;--faint:#94a3b8;
  --soft:#f1f5f9;--seg:#eef1f6;--line2:#cbd5e1;--topbar:rgba(255,255,255,.92);--ink:#0f172a;--ink-fg:#fff;
  --primary:#ea580c;--primary-600:#c2410c;--primary-50:#fff4ec;--primary-200:#fdba74;
  --side:#0f172a;--side2:#1e293b;
  --green:#16a34a;--green-50:#ecfdf3;--red:#dc2626;--red-50:#fef2f2;--amber:#d97706;--amber-50:#fffbeb;--blue:#2563eb;--blue-50:#eff6ff;--violet:#7c3aed;--violet-50:#f5f3ff;
  --radius:14px;--shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.06);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b1120;--surface:#111827;--surface2:#0f172a;--border:#1f2a3b;--text:#e5e7eb;--text2:#cbd5e1;--muted:#94a3b8;--faint:#64748b;
  --soft:#1e293b;--seg:#1e293b;--line2:#334155;--topbar:rgba(17,24,39,.9);--ink:#f1f5f9;--ink-fg:#0f172a;
  --primary-50:rgba(234,88,12,.15);--primary-200:#9a3412;--side:#070b14;--side2:#111827;
  --green-50:rgba(22,163,74,.16);--red-50:rgba(220,38,38,.16);--amber-50:rgba(217,119,6,.16);--blue-50:rgba(37,99,235,.18);--violet-50:rgba(124,58,237,.2);
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary);cursor:pointer;text-decoration:none;font-weight:500}
.hidden{display:none!important}
.ic{flex-shrink:0;display:block}
.muted{color:var(--muted)}
.r{text-align:right}
kbd{font-family:inherit;font-size:10.5px;background:var(--soft);border:1px solid var(--border);border-radius:5px;padding:1px 5px;color:var(--muted)}

/* ---------- Buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font-weight:600;font-size:13.5px;white-space:nowrap;transition:.15s;border:1px solid transparent}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(234,88,12,.25)}
.btn-primary:hover:not(:disabled){background:var(--primary-600)}
.btn-dark{background:var(--ink);color:var(--ink-fg)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text2)}
.btn-ghost:hover:not(:disabled){background:var(--surface2);border-color:var(--line2)}
.btn-soft{background:var(--primary-50);color:var(--primary-600);border-color:var(--primary-200)}
.btn-green{background:#25d366;color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:8px}
.grow{flex:1}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:10px;color:var(--muted);transition:.15s}
.icon-btn:hover{background:var(--soft);color:var(--text)}
.icon-btn.sm{width:30px;height:30px;border-radius:8px}
.icon-btn.danger:hover{background:var(--red-50);color:var(--red)}
.input{width:100%;height:40px;border:1px solid var(--border);border-radius:10px;padding:0 12px;background:var(--surface);outline:0;transition:.15s}
textarea.input{height:auto;padding:10px 12px;resize:vertical}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(234,88,12,.12)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:600;color:var(--text2)}
.field small{color:var(--faint);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.check{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none;margin-bottom:10px}
.check input{width:18px;height:18px;accent-color:var(--primary);flex-shrink:0}
.switch{position:relative;width:40px;height:22px;flex-shrink:0;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line2);border-radius:20px;transition:.2s;cursor:pointer}
.switch span::after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(18px)}

.seg{display:flex;background:var(--seg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 8px;border-radius:8px;font-weight:500;color:var(--muted);font-size:13px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1);font-weight:600}
.seg.pay button.on{background:var(--ink);color:var(--ink-fg)}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.badge.green{background:var(--green-50);color:var(--green)}
.badge.red{background:var(--red-50);color:var(--red)}
.badge.amber{background:var(--amber-50);color:var(--amber)}
.badge.blue{background:var(--blue-50);color:var(--blue)}
.badge.violet{background:var(--violet-50);color:var(--violet)}
.badge.orange{background:var(--primary-50);color:var(--primary)}

/* ---------- Layout ---------- */
.sidebar{width:252px;background:var(--side);display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:70;transition:transform .25s ease}
.brand{display:flex;align-items:center;gap:12px;padding:22px 20px 16px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#fb923c,#ea580c);display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;box-shadow:0 6px 16px rgba(234,88,12,.35);flex-shrink:0}
.brand b{display:block;color:#fff;font-size:15px;line-height:1.25;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:#64748b;font-size:12px}
.nav{flex:1;padding:4px 12px;overflow-y:auto}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#475569;padding:14px 12px 8px;font-weight:700}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:#94a3b8;font-weight:500;margin-bottom:2px;transition:.15s}
.nav a:hover{background:rgba(255,255,255,.05);color:#e2e8f0}
.nav a.active{background:rgba(234,88,12,.16);color:#fff}
.nav a.active .ic{color:#fb923c}
.nav a .nb{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px}
.nav a .nb.o{background:var(--primary)}
.side-user{margin:12px;padding:12px;border-radius:12px;background:var(--side2);display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;flex-shrink:0;font-size:14px}
.side-user b{color:#fff;font-size:13px;display:block}
.side-user small{color:#94a3b8;font-size:12px}
.side-user button{margin-left:auto;color:#94a3b8;padding:8px;border-radius:8px}
.side-user button:hover{background:rgba(255,255,255,.08);color:#fff}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:65;display:none}
.overlay.show{display:block}

.main{margin-left:252px;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:64px;background:var(--topbar);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:40}
.topbar h1{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;background:var(--surface2);border:1px solid var(--border);padding:7px 12px;border-radius:10px;white-space:nowrap}
.hamb{display:none}
.view{padding:24px;flex:1}
.view.flush{padding:0}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.page-head p{color:var(--muted);margin-top:4px}
.page-head .actions{display:flex;gap:10px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.card-h h3{font-size:15px;font-weight:700}
.card-h .muted{font-size:12.5px}
.section-t{font-size:15px;font-weight:700;margin:24px 0 12px;display:flex;align-items:center;gap:8px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:20px}
.kpi{display:flex;gap:14px;align-items:flex-start}
.kpi-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.kpi-ic.orange{background:var(--primary-50);color:var(--primary)}
.kpi-ic.blue{background:var(--blue-50);color:var(--blue)}
.kpi-ic.green{background:var(--green-50);color:var(--green)}
.kpi-ic.red{background:var(--red-50);color:var(--red)}
.kpi-ic.violet{background:var(--violet-50);color:var(--violet)}
.kpi-ic.amber{background:var(--amber-50);color:var(--amber)}
.kpi-ic.slate{background:var(--soft);color:var(--muted)}
.kpi span{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;margin:2px 0 4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi small{font-size:12px;color:var(--faint)}
.kpi small.up{color:var(--green);font-weight:600}
.kpi small.down{color:var(--red);font-weight:600}

.dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.span2{grid-column:span 2}
.bars{display:flex;gap:12px;height:230px;align-items:stretch}
.bars.sm{gap:4px;height:180px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.bar-track{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bar{width:100%;max-width:46px;border-radius:8px 8px 4px 4px;background:var(--primary-200);transition:height .5s;min-height:4px}
.bars.sm .bar{border-radius:5px 5px 2px 2px;background:#a78bfa}
.bars.sm .bar.peak{background:var(--violet)}
.bar-col.today .bar{background:linear-gradient(180deg,#fb923c,#ea580c)}
.bar-v{font-size:11.5px;font-weight:600;color:var(--muted);height:16px;white-space:nowrap}
.bar-l{font-size:12px;color:var(--muted);white-space:nowrap}
.bars.sm .bar-l{font-size:10px}
.bar-col.today .bar-l{color:var(--text);font-weight:700}
.prog{height:8px;background:var(--soft);border-radius:8px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;border-radius:8px}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--soft)}
.list-row:last-child{border-bottom:0}
.list-row .grow{min-width:0}
.list-row b{font-size:13.5px}
.list-row small{display:block;color:var(--muted);font-size:12px}
.rank{width:28px;height:28px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--muted);flex-shrink:0}
.mini-thumb{width:40px;height:40px;border-radius:10px;overflow:hidden;flex-shrink:0}
.mini-thumb img,.mini-thumb .ph{width:100%;height:100%;object-fit:cover;font-size:20px}
.empty{text-align:center;padding:36px 16px;color:var(--faint)}
.empty .ic{margin:0 auto 10px;color:var(--line2)}
.empty p{color:var(--muted);font-weight:600}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse;min-width:640px}
.table th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:12px 16px;border-bottom:1px solid var(--soft);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr:hover{background:var(--surface2)}
.table tr.cancel td{color:var(--faint)}
.table tr.cancel td b{text-decoration:line-through}
.table .acts{display:flex;gap:2px;justify-content:flex-end;align-items:center}
.table .r{text-align:right}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tabs button{padding:10px 16px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--primary);border-color:var(--primary)}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.toolbar .search{flex:1;min-width:200px}
.toolbar select.input{width:auto;min-width:160px}

/* ---------- POS ---------- */
.pos{display:grid;grid-template-columns:1fr 410px;height:calc(100vh - 64px)}
.pos-main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.pos-top{padding:18px 24px 0;background:var(--bg)}
.pos-bar{display:flex;gap:10px}
.pos-bar .search{flex:1}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0 14px;height:44px;color:var(--faint);transition:.15s}
.search input{border:0;outline:0;flex:1;background:none;height:100%;color:var(--text);min-width:0}
.search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(234,88,12,.12)}
.run-btn{height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--border);padding:0 14px;display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.run-btn em{font-style:normal;background:var(--primary);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-weight:500;color:var(--text2);transition:.15s}
.chip:hover{border-color:var(--line2)}
.chip em{font-style:normal;font-size:11px;background:var(--soft);border-radius:999px;padding:1px 7px;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.chip.on em{background:rgba(127,127,127,.25);color:inherit}
.chip.sm{padding:6px 12px;font-size:12.5px}
.food-grid{flex:1;overflow-y:auto;padding:2px 24px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px;align-content:start}
.food{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .12s,box-shadow .15s,border-color .15s;position:relative}
.food:hover{border-color:var(--primary-200);box-shadow:var(--shadow);transform:translateY(-2px)}
.food:active{transform:scale(.97)}
.food.incart{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.food-img{position:relative;aspect-ratio:4/3;background:var(--surface2);overflow:hidden}
.food-img img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;font-size:40px;background:linear-gradient(135deg,hsl(var(--h) 85% 95%),hsl(var(--h) 70% 86%))}
[data-theme="dark"] .ph{background:linear-gradient(135deg,hsl(var(--h) 30% 22%),hsl(var(--h) 35% 16%))}
.qbadge{position:absolute;top:8px;right:8px;background:var(--primary);color:#fff;min-width:26px;height:26px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:13px;padding:0 7px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.code{position:absolute;top:8px;left:8px;background:rgba(15,23,42,.7);color:#fff;font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 6px;letter-spacing:.03em}
.soldout{position:absolute;inset:0;background:rgba(15,23,42,.55);color:#fff;display:grid;place-items:center;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px}
.food.out{opacity:.75;cursor:not-allowed}
.food.out:hover{transform:none;box-shadow:none;border-color:var(--border)}
.food-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.food-name{font-weight:600;font-size:13.5px;line-height:1.3;display:flex;gap:6px;align-items:flex-start}
.food-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.food-foot b{font-size:15px;font-variant-numeric:tabular-nums}
.food-foot small{font-size:11px;color:var(--muted)}
.warn{color:var(--amber)!important;font-weight:600}
.vd{width:13px;height:13px;border:1.5px solid var(--green);border-radius:3px;display:inline-grid;place-items:center;flex-shrink:0;margin-top:2px}
.vd::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--green)}
.vd.nv{border-color:#dc2626}
.vd.nv::after{background:#dc2626}

.cart{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.cart-head{display:flex;align-items:flex-start;justify-content:space-between;padding:16px 20px 10px;gap:8px}
.cart-head h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cart-head small{color:var(--muted);font-size:12.5px}
.cart-meta{padding:0 20px 12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meta-grid .input{height:36px;font-size:13px}
.meta-grid .full{grid-column:1/-1}
.cust-hint{font-size:12px;color:var(--green);font-weight:600}
.cust-hint:empty{display:none}
.cart-lines{flex:1 0 auto;padding:4px 20px;min-height:120px}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--border)}
.line-info{flex:1;min-width:0}
.line-name{font-weight:600;font-size:13.5px;display:flex;gap:6px;align-items:flex-start}
.line-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line-sub{margin-left:19px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.line-sub small{color:var(--muted);font-size:12px}
.line-sub a{font-size:11.5px}
.line-note{font-size:11.5px;color:var(--amber);font-weight:600}
.kt{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 5px;background:var(--green-50);color:var(--green)}
.kt.new{background:var(--amber-50);color:var(--amber)}
.qty{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:10px}
.qty button{width:30px;height:30px;display:grid;place-items:center;color:var(--muted);border-radius:9px}
.qty button:hover{color:var(--primary);background:var(--primary-50)}
.qty span{min-width:22px;text-align:center;font-weight:700;font-size:13px}
.line-amt{width:72px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.empty-cart{text-align:center;padding:36px 10px;color:var(--faint)}
.empty-cart .ic{margin:0 auto 10px;color:var(--line2)}
.empty-cart p{font-weight:600;color:var(--muted)}
.cart-foot{border-top:1px solid var(--border);padding:14px 20px 18px;background:var(--surface2);display:flex;flex-direction:column;gap:10px}
.disc{display:flex;align-items:center;gap:10px}
.disc label{font-size:13px;font-weight:600;color:var(--text2);flex:1}
.disc .input{width:90px;height:34px}
.disc .seg{width:84px}
.disc .seg button{padding:5px}
.sum-row{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding:1px 0;font-variant-numeric:tabular-nums}
.sum-row.dis{color:var(--green)}
.sum-total{display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:800;padding-top:8px;margin-top:4px;border-top:1px dashed var(--line2);letter-spacing:-.02em}
.sum-total span{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
.paybox{display:flex;gap:8px;align-items:center}
.paybox .input{height:34px;font-size:13px}
.paybox label{font-size:12px;color:var(--muted);white-space:nowrap}
.chg{font-weight:700;white-space:nowrap;font-size:13px}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.split label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}
.split .input{height:34px;font-size:13px}
.cart-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cart-actions .btn{height:42px;padding:0 8px}
.cart-actions .main-act{grid-column:1/-1;height:48px;font-size:15px}
.cart-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:55;display:none}
.cart-fab{display:none;position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:50;background:var(--ink);color:var(--ink-fg);border-radius:16px;padding:12px 16px;align-items:center;gap:12px;font-weight:600;box-shadow:0 12px 30px rgba(15,23,42,.35)}
.cart-fab .cnt{background:var(--primary);color:#fff;border-radius:10px;min-width:34px;height:34px;display:grid;place-items:center;font-weight:800}
.cart-fab .tot{margin-left:auto;font-size:17px;font-weight:800}
.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.04)}}
.only-m{display:none!important}

/* ---------- Tables (restaurant) ---------- */
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:132px;transition:.15s;position:relative;box-shadow:var(--shadow)}
.tcard:hover{transform:translateY(-2px);border-color:var(--primary)}
.tcard .tn{font-size:24px;font-weight:800;letter-spacing:-.02em}
.tcard .dot{position:absolute;top:18px;right:16px;width:10px;height:10px;border-radius:50%;background:var(--green)}
.tcard.busy{background:linear-gradient(160deg,var(--primary-50),var(--surface) 70%);border-color:var(--primary-200)}
.tcard.busy .dot{background:var(--primary);box-shadow:0 0 0 4px rgba(234,88,12,.2)}
.tcard .amt{font-size:18px;font-weight:800;margin-top:auto}
.tcard small{color:var(--muted);font-size:12px}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* ---------- Menu mgmt ---------- */
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.mcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.mcard .food-img{aspect-ratio:16/10}
.mcard-b{padding:12px 14px}
.mcard-b .t{display:flex;gap:6px;font-weight:700;align-items:flex-start}
.mcard-b .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:6px}
.mcard-b .meta b{font-size:16px}
.mcard-f{display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:1px solid var(--soft)}
.mcard-f .lbl{font-size:12px;color:var(--muted);margin-right:auto;display:flex;align-items:center;gap:8px;cursor:pointer}
.mcard.off{opacity:.6}
.img-pick{border:2px dashed var(--line2);border-radius:14px;aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);cursor:pointer;overflow:hidden;background:var(--surface2);margin-bottom:8px;transition:.15s}
.img-pick:hover{border-color:var(--primary);color:var(--primary)}
.img-pick img{width:100%;height:100%;object-fit:cover}
.img-pick small{color:var(--faint)}
.emoji-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.emoji-row button{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);font-size:20px;background:var(--surface)}
.emoji-row button.on{border-color:var(--primary);background:var(--primary-50)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* ---------- Staff ---------- */
.staff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.scard{display:flex;gap:12px;align-items:center}
.scard .avatar{width:46px;height:46px;border-radius:14px;font-size:17px}
.scard b{display:block}
.scard small{color:var(--muted);font-size:12px}
.perm-table td:not(:first-child),.perm-table th:not(:first-child){text-align:center}
.perm-table input{width:18px;height:18px;accent-color:var(--primary)}

/* ---------- Modal / toast ---------- */
.modal-wrap{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:540px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 25px 60px rgba(0,0,0,.25);animation:pop .2s}
.modal.sm{max-width:420px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-h h3{font-size:16px;font-weight:700}
.modal-b{padding:20px 22px;overflow-y:auto}
.modal-f{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
.toasts{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#0f172a;color:#fff;padding:12px 16px;border-radius:12px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;align-items:center;gap:10px;animation:pop .2s;max-width:380px}
.toast.ok{background:#065f46}
.toast.err{background:#991b1b}
.qr-box{text-align:center}
.qr-box img{width:240px;height:240px;margin:0 auto;display:block;background:#fff;padding:10px;border-radius:12px;border:1px solid var(--border)}
.qr-box b{display:block;font-size:30px;margin-top:14px;letter-spacing:-.02em}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:radial-gradient(circle at 20% 20%,rgba(234,88,12,.35),transparent 45%),radial-gradient(circle at 80% 90%,rgba(251,146,60,.2),transparent 40%),#0f172a;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.login-art h2{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1;max-width:460px}
.login-art p{color:#94a3b8;margin-top:14px;font-size:15px;max-width:440px;line-height:1.6}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:480px}
.feat div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;font-size:13px;color:#cbd5e1;display:flex;gap:10px;align-items:center}
.feat .ic{color:#fb923c}
.login-form{display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:390px}
.login-card h3{font-size:24px;font-weight:800;letter-spacing:-.02em}
.staff-pick{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;margin-top:20px}
.sp{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:14px;border:2px solid var(--border);min-width:88px;background:var(--surface);transition:.15s}
.sp.on{border-color:var(--primary);background:var(--primary-50)}
.sp b{font-size:12.5px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp small{font-size:11px;color:var(--muted)}
.pin-dots{display:flex;gap:16px;justify-content:center;margin:24px 0}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);transition:.15s}
.pin-dots i.f{background:var(--primary);border-color:var(--primary)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{height:60px;border-radius:14px;background:var(--surface);border:1px solid var(--border);font-size:22px;font-weight:600;transition:.1s;display:grid;place-items:center}
.keypad button:active{background:var(--primary-50);transform:scale(.96)}
.login-m-brand{display:none;align-items:center;gap:12px;margin-bottom:24px}

/* ---------- Receipt ---------- */
#printArea{position:fixed;left:-10000px;top:0;background:#fff}
.rc{padding:3mm 3mm 8mm;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#000;line-height:1.35;background:#fff}
.rc .c{text-align:center}
.rc .h1{font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.rc .hr{border-top:1px dashed #000;margin:5px 0}
.rc .rw{display:flex;justify-content:space-between;gap:6px}
.rc table{width:100%;border-collapse:collapse}
.rc th{font-weight:700;border-bottom:1px dashed #000;padding:2px 0;text-align:left;font-size:11.5px;color:#000}
.rc td{padding:2px 0;vertical-align:top;color:#000}
.rc .n{text-align:right;white-space:nowrap}
.rc .tot{font-size:16px;font-weight:800}
.rc .big{font-size:15px;font-weight:700}
.rc .kot td{font-size:14px;font-weight:700;padding:3px 0}
.rc .note{font-size:11px;font-style:italic;font-weight:400}
.rc .sec{font-weight:700;margin-top:4px;text-transform:uppercase;font-size:11.5px}
.rc img.qr{width:30mm;height:30mm;display:block;margin:4px auto}
.rc-preview{width:302px;margin:0 auto;box-shadow:0 4px 20px rgba(0,0,0,.12);border:1px solid var(--border)}

@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{position:static;left:0}
}

/* ---------- Responsive ---------- */
@media(max-width:1200px){.pos{grid-template-columns:1fr 370px}}
@media(max-width:1024px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.3)}
  .main{margin-left:0}
  .hamb{display:inline-grid}
  .dash-grid{grid-template-columns:1fr 1fr}
  .span2{grid-column:1/-1}
  .pos{grid-template-columns:1fr;height:auto;min-height:calc(100vh - 64px)}
  .pos-main{overflow:visible}
  .pos-top{position:sticky;top:64px;z-index:20;padding:12px 16px 0}
  .chips{padding:12px 0}
  .food-grid{overflow:visible;padding:4px 16px 110px;gap:12px}
  .cart{position:fixed;left:0;right:0;bottom:0;height:92vh;height:92dvh;border-radius:22px 22px 0 0;z-index:60;transform:translateY(105%);transition:transform .3s ease;border:0;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
  .cart.open{transform:none}
  .cart.open~.cart-backdrop{display:block}
  .cart-fab.show{display:flex}
  .only-m{display:inline-grid!important}
  .cart-foot{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
}
@media(max-width:860px){
  .login{grid-template-columns:1fr}
  .login-art{display:none}
  .login-m-brand{display:flex}
}
@media(max-width:640px){
  .view{padding:16px}
  .topbar{padding:0 10px;gap:6px}
  .topbar h1{font-size:16px}
  .pill.clock,.pill.who,.fs-btn{display:none}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{flex-direction:column;gap:10px}
  .kpi b{font-size:19px}
  .card{padding:16px}
  .dash-grid{grid-template-columns:1fr}
  .food-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .food-body{padding:8px 10px 10px}
  .food-name{font-size:13px}
  .grid2,.grid3{grid-template-columns:1fr}
  .modal-wrap{align-items:flex-end;padding:0}
  .modal{border-radius:22px 22px 0 0;max-height:94vh}
  .modal-f{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .page-head h2{font-size:19px}
  .toasts{left:16px;right:16px;top:auto;bottom:90px}
  .toast{max-width:none}
  .bars{gap:6px;height:200px}
  .bar-v{font-size:10px}
  .bars.sm .bar-v{display:none}
  .menu-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .mcard-b{padding:10px}
  .mcard-b .meta{flex-direction:column;align-items:flex-start}
  .mcard-f{padding:8px 10px}
  .staff-grid{grid-template-columns:1fr}
  .toolbar select.input{flex:1}
  .tables{grid-template-columns:repeat(2,1fr);gap:10px}
  .run-btn span{display:none}
}
</style>
</head>
<body>

<div id="loginView"></div>

<div id="appView" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo" id="brandLogo">H</div><div style="min-width:0"><b id="brandName">Hotel</b><small>Billing &amp; POS</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-user" id="sideUser"></div>
  </aside>
  <div class="overlay" id="overlay" onclick="toggleSide(false)"></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn hamb" id="hambBtn" onclick="toggleSide(true)" aria-label="Menu"></button>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="top-right">
        <div class="pill clock" id="clock"></div>
        <button class="icon-btn fs-btn" id="fsBtn" title="Full screen" onclick="toggleFS()"></button>
        <button class="icon-btn" id="themeBtn" title="Light / Dark mode" onclick="toggleTheme()"></button>
        <div class="pill who" id="topUser"></div>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toasts" id="toasts"></div>
<div id="printArea"></div>

  const tb=valid.filter(b=>dkey(b.t)===today),yb=valid.filter(b=>dkey(b.t)===yest);
  const ts=sum(tb,'total'),ys=sum(yb,'total');
  const pct=ys?((ts-ys)/ys*100):null;

let cart=DB.get('cart',[]);
let P={cat:'all',q:'',type:'Dine-in',table:'',cust:'',phone:'',dv:'',dt:'%',pay:'Cash',recv:'',sc:'',su:'',sk:'',orderId:null,...DB.get('posmeta',{})};
const saveCart=()=>{DB.set('cart',cart);DB.set('posmeta',P)};
const cartLines=()=>cart.map(c=>{const it=S.items.find(i=>i.id===c.id);return it?{...it,qty:c.qty,note:c.note||'',kot:c.kot||0}:null}).filter(Boolean);
function calc(lines){
  const s=S.settings;
  const sub=r2(sum(lines,l=>l.price*l.qty));
  const dv=can('discount')?Math.max(0,parseFloat(P.dv)||0):0;
  const disc=r2(P.dt==='%'?sub*Math.min(dv,100)/100:Math.min(dv,sub));
  const taxable=sub-disc;
  const svcP=P.type==='Dine-in'?(+s.svc||0):0,svc=r2(taxable*svcP/100);
  const pack=P.type!=='Dine-in'&&lines.length?r2(+s.pack||0):0;
  const gst=+s.gst||0,tax=r2((taxable+svc+pack)*gst/100);
  const raw=taxable+svc+pack+tax,total=Math.max(0,Math.round(raw)),round=r2(total-raw);
  return {sub,disc,svcP,svc,pack,gst,tax,round,total};
}
function popularIds(){
  const since=Date.now()-30*864e5,q={};
  S.bills.filter(b=>!b.cancelled&&b.t>=since).forEach(b=>b.items.forEach(i=>q[i.id]=(q[i.id]||0)+i.qty));
  return Object.entries(q).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
}

function addToCart(id){
  const it=S.items.find(i=>i.id===id);if(!it)return;
  const c=cart.find(x=>x.id===id&&!x.note),total=sum(cart.filter(x=>x.id===id),'qty')+1;
  if(it.track&&total>it.stock)return toast(`Only ${it.stock} ${it.name} left in stock`,'err');
  if(c)c.qty++;else cart.push({id,qty:1});
  saveCart();renderFood();renderCart();
  const f=$('#cartFab');if(f){f.classList.remove('bump');void f.offsetWidth;f.classList.add('bump')}
}
function chQty(idx,d){

  c.qty+=d;if(c.qty<=0)cart.splice(idx,1);else if(c.kot>c.qty)c.kot=c.qty;

/* ---------- Hold / running orders ---------- */
function holdOrder(silent){
  const lines=cartLines();if(!lines.length)return false;
  if(P.type==='Dine-in'&&!P.table.trim()){toast('Enter a table number to hold this order','err');return false}
  const o=P.orderId&&S.orders.find(x=>x.id===P.orderId);
  const data={type:P.type,table:P.type==='Dine-in'?P.table.trim():'',cust:P.cust,phone:P.phone,items:cart.map(c=>({...c})),updated:Date.now(),staff:o?.staff||me().name};
  if(!o&&data.table&&S.orders.some(x=>x.table===data.table)){toast(`Table ${data.table} already has a running order — open it from Running`,'err');return false}
  if(!silent&&S.settings.kotOnHold&&cart.some(c=>c.qty>(c.kot||0)))printKOT(true);
  data.items=cart.map(c=>({...c}));
  if(o)Object.assign(o,data);else S.orders.push({id:uid(),t:Date.now(),...data});
  save('orders');act(`Held order${data.table?' — Table '+data.table:' — '+data.type} (${money(sum(lines,l=>l.price*l.qty))})`);
  toast(data.table?`Order saved to Table ${data.table}`:'Order put on hold','ok');
  resetPos();toggleCart(false);
  return true;
}
function sendOrder(){holdOrder()}
function openOrder(id){
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  const doIt=()=>{cart=o.items.map(i=>({...i}));Object.assign(P,{orderId:o.id,type:o.type,table:o.table,cust:o.cust||'',phone:o.phone||'',dv:'',recv:'',sc:'',su:'',sk:''});saveCart();closeModal();if(cur==='pos'){renderFood();renderCart();toggleCart(true)}else go('pos')};
  if(cart.length&&P.orderId!==id&&!P.orderId)return confirmDlg('Discard current order?','You have unsaved items in the cart. Hold them first, or discard and open this order.',doIt,'Discard & open');
  if(P.orderId&&P.orderId!==id&&cart.length){holdOrder(true)}
  doIt();
}

/* ---------- Save bill ---------- */
function saveBill(print){
  if(!can('settle'))return toast('You are not allowed to settle bills','err');
  const lines=cartLines();if(!lines.length)return toast('Add items first','err');
  for(const id of new Set(lines.map(l=>l.id))){const it=S.items.find(i=>i.id===id),q=sum(lines.filter(l=>l.id===id),'qty');if(it.track&&it.stock<q)return toast(`Only ${it.stock} ${it.name} in stock`,'err')}
  const t=calc(lines),u=me();let split=null;
  if(P.pay==='Split'){const sp={Cash:+P.sc||0,UPI:+P.su||0,Card:+P.sk||0};if(Math.abs(sp.Cash+sp.UPI+sp.Card-t.total)>0.01)return toast(`Split amounts must add up to ${money(t.total)}`,'err');split=sp}
  const recv=P.pay==='Cash'&&parseFloat(P.recv)>=t.total?r2(parseFloat(P.recv)):0;
  const o=P.orderId&&S.orders.find(x=>x.id===P.orderId);
  const bill={id:uid(),no:S.settings.prefix+S.settings.next,t:Date.now(),
    items:lines.map(l=>({id:l.id,name:l.name,price:l.price,qty:l.qty,cat:l.cat,note:l.note})),
    ...t,pay:P.pay,split,recv,change:recv?r2(recv-t.total):0,type:P.type,table:P.type==='Dine-in'?P.table.trim():'',cust:P.cust.trim(),phone:P.phone.trim(),staff:u.name,staffId:u.id,orderStaff:o?.staff||''};
  lines.forEach(l=>{const it=S.items.find(i=>i.id===l.id);if(it.track)it.stock-=l.qty});
  S.bills.push(bill);S.settings.next++;
  if(o)S.orders=S.orders.filter(x=>x.id!==o.id);
  upsertCustomer(bill);
  save('bills','items','settings','orders');
  if(bill.disc)act(`Gave discount ${money(bill.disc)} on ${bill.no}`);
  resetPos();toggleCart(false);
  toast(`Bill ${bill.no} saved · ${money(bill.total)}${bill.change?' · Return '+money(bill.change):''}`,'ok');
  if(print)printBill(bill);
}
function upsertCustomer(b){
  const d=digits(b.phone);if(d.length<10)return;
  let c=S.customers.find(x=>digits(x.phone)===d);
  if(!c){c={id:uid(),name:'',phone:b.phone,visits:0,spent:0,first:b.t,note:''};S.customers.push(c)}
  if(b.cust)c.name=b.cust;c.visits++;c.spent=r2(c.spent+b.total);c.last=b.t;save('customers');
}

function viewBill(id){
  const b=S.bills.find(x=>x.id===id);if(!b)return;
  openModal(`Bill ${esc(b.no)}`,`<div class="rc-preview">${receiptHTML(b)}</div>${b.cancelled?`<p class="muted" style="text-align:center;margin-top:12px;font-size:12px">Cancelled by ${esc(b.cancelledBy)} on ${fmtDT(b.cancelledAt)}</p>`:''}`,
    `${can('deleteBill')&&!b.cancelled?`<button class="btn btn-ghost" style="color:var(--red);margin-right:auto" onclick="closeModal();cancelBill('${b.id}')">Cancel bill</button>`:''}<button class="btn btn-green" onclick="waBill('${b.id}')">${I('msg',16)} WhatsApp</button><button class="btn btn-primary" onclick="printBill(S.bills.find(x=>x.id==='${b.id}'))">${I('printer',16)} Print</button>`,{w:440});
}
function billText(b){
  const s=S.settings;
  return `*${s.name}*\nBill: ${b.no}\nDate: ${fmtDT(b.t)}\n----------------------\n`+
    b.items.map(i=>`${i.qty} x ${i.name} = ₹${m2(i.qty*i.price)}`).join('\n')+
    `\n----------------------\n`+(b.disc?`Discount: -₹${m2(b.disc)}\n`:'')+(b.tax?`GST: ₹${m2(b.tax)}\n`:'')+`*Total: ₹${m2(b.total)}* (${b.pay})\n\n${s.footer||'Thank you!'}`;
}
function waBill(id){
  const b=S.bills.find(x=>x.id===id);if(!b)return;
  let ph=digits(b.phone);if(ph.length===10)ph='91'+ph;
  window.open(`https://wa.me/${ph}?text=${encodeURIComponent(billText(b))}`,'_blank');
}
function cancelBill(id){
  const b=S.bills.find(x=>x.id===id);if(!b)return;
  confirmDlg('Cancel bill '+esc(b.no)+'?','The bill stays in records as <b>Cancelled</b>, is excluded from sales, and tracked stock is returned.',()=>{
    b.cancelled=true;b.cancelledBy=me().name;b.cancelledAt=Date.now();
    b.items.forEach(i=>{const it=S.items.find(x=>x.id===i.id);if(it&&it.track)it.stock+=i.qty});
    const c=digits(b.phone).length===10&&S.customers.find(x=>digits(x.phone)===digits(b.phone));
    if(c){c.visits=Math.max(0,c.visits-1);c.spent=r2(Math.max(0,c.spent-b.total));save('customers')}
    save('bills','items');act(`Cancelled bill ${b.no} (${money(b.total)})`);toast('Bill cancelled','ok');renderShell();if(cur==='bills')renderBills();else go(cur);
  },'Cancel bill');
}
function printDayReport(){
  const v=filteredBills().filter(b=>!b.cancelled),cn=filteredBills().length-v.length;
  const ex=S.expenses.filter(e=>inRange(e.t,BF.from,BF.to)),exT=sum(ex,'amount'),tot=sum(v,'total');
  const cats={},items={};v.forEach(b=>b.items.forEach(i=>{const n=catOf(i.cat)?.name||'Other';cats[n]=(cats[n]||0)+i.qty*i.price;items[i.name]=items[i.name]||{q:0,a:0};items[i.name].q+=i.qty;items[i.name].a+=i.qty*i.price}));
  const row=(a,b)=>`<div class="rw"><span>${a}</span><span>${b}</span></div>`;
  const period=BF.from===BF.to?new Date(BF.from).toLocaleDateString('en-IN'):`${new Date(BF.from).toLocaleDateString('en-IN')} - ${new Date(BF.to).toLocaleDateString('en-IN')}`;
  doPrint(`<div class="rc"><div class="c h1">${esc(S.settings.name)}</div><div class="c big">SALES REPORT</div><div class="c">${period}</div>
    <div class="c">Printed ${fmtDT(Date.now())} by ${esc(me().name)}</div><div class="hr"></div>
    ${row('Total bills',v.length)}${row('Cancelled bills',cn)}${row('Gross (items)',m2(sum(v,'sub')))}${row('Discount','- '+m2(sum(v,'disc')))}
    ${sum(v,'svc')?row('Service charge',m2(sum(v,'svc'))):''}${sum(v,'pack')?row('Packing charge',m2(sum(v,'pack'))):''}${row('GST',m2(sum(v,'tax')))}
    <div class="hr"></div><div class="rw tot"><span>NET SALES</span><span>₹ ${m2(tot)}</span></div><div class="hr"></div>
    <div class="sec">Payment-wise</div>${['Cash','UPI','Card'].map(p=>row(p,m2(sum(v,b=>payAmt(b,p))))).join('')}
    <div class="hr"></div><div class="sec">Category-wise</div>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,a])=>row(esc(k),m2(a))).join('')||'-'}
    <div class="hr"></div><div class="sec">Item-wise</div>
    <table><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Amt</th></tr></thead><tbody>${Object.entries(items).sort((a,b)=>b[1].a-a[1].a).map(([n,x])=>`<tr><td>${esc(n)}</td><td class="n">${x.q}</td><td class="n">${m2(x.a)}</td></tr>`).join('')}</tbody></table>
    ${can('expenses')?`<div class="hr"></div>${row('Expenses','- '+m2(exT))}<div class="rw big"><span>Net (Sales - Exp)</span><span>${m2(tot-exT)}</span></div>`:''}
    <div class="hr"></div><div class="c">*** End of report ***</div></div>`);
}
function exportCSV(){
  const rows=[['Bill No','Date','Time','Order Type','Table','Customer','Phone','Items','Subtotal','Discount','Service','Packing','GST','Round Off','Total','Payment','Cash','UPI','Card','Staff','Status']];
  filteredBills().forEach(b=>rows.push([b.no,new Date(b.t).toLocaleDateString('en-IN'),fmtT(b.t),b.type,b.table,b.cust,b.phone,b.items.map(i=>i.name+' x'+i.qty).join('; '),b.sub,b.disc,b.svc||0,b.pack||0,b.tax,b.round,b.total,b.pay,payAmt(b,'Cash'),payAmt(b,'UPI'),payAmt(b,'Card'),b.staff,b.cancelled?'Cancelled':'Paid']));
  downloadCSV(`sales_${BF.from}_to_${BF.to}.csv`,rows);
}
const downloadCSV=(name,rows)=>download(name,rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function saveCust(id){
  const d={name:$('#cuName').value.trim(),phone:$('#cuPhone').value.trim(),note:$('#cuNote').value.trim()};

    <div class="food-img">${thumb(i)}${i.code?`<span class="code">#${esc(i.code)}</span>`:''}${!i.active?'<span class="soldout">Hidden</span>':''}</div>
    <div class="mcard-b"><div class="t"><i class="vd ${i.veg?'':'nv'}"></i>${esc(i.name)}</div>
      <div class="meta"><b>${money(i.price)}</b><span class="badge">${catOf(i.cat)?.emoji||''} ${esc(catOf(i.cat)?.name||'—')}</span></div></div>

function toggleItem(id,v){const i=S.items.find(x=>x.id===id);i.active=v;save('items');drawMenuGrid()}

  tmpImg=it.img||'';

    <div style="display:flex;justify-content:space-between;margin-bottom:16px"><small class="muted">Photo is auto-resized to save space</small><a id="imgRm" onclick="tmpImg='';drawImgPick()" style="font-size:12.5px;color:var(--red)">Remove photo</a></div>
    <div class="grid2" style="grid-template-columns:2fr 1fr"><div class="field"><label>Food name *</label><input class="input" id="fName" value="${esc(it.name)}" placeholder="e.g. Chicken Biryani" autofocus></div>
    <div class="field"><label>Short code</label><input class="input" id="fCode" value="${esc(it.code||'')}" placeholder="101"></div></div>
    <div class="grid2">
      <div class="field"><label>Category *</label><select class="input" id="fCat">${S.categories.map(c=>`<option value="${c.id}" ${it.cat===c.id?'selected':''}>${c.emoji} ${esc(c.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Price (₹) *</label><input class="input" id="fPrice" type="number" min="0" step="0.5" inputmode="decimal" value="${it.price}"></div>

    <div class="field"><label>Type</label><div class="seg" id="fVeg"><button type="button" class="${it.veg?'on':''}" data-v="1" onclick="segPick(this)">🟢 Veg</button><button type="button" class="${it.veg?'':'on'}" data-v="0" onclick="segPick(this)">🔴 Non-Veg</button></div></div>
    <label class="check"><input type="checkbox" id="fTrack" ${it.track?'checked':''} onchange="$('#trackBox').classList.toggle('hidden',!this.checked)"> Track stock for this item</label>

      <div class="field"><label>Current stock</label><input class="input" id="fStock" type="number" min="0" value="${it.stock}"></div>
      <div class="field"><label>Low stock alert at</label><input class="input" id="fLow" type="number" min="0" value="${it.low}"></div>
    </div>

    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveItem('${id||''}')">${I('check',16)} Save Item</button>`);
  drawImgPick();
}
function segPick(b){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))}
function drawImgPick(){
  $('#imgPick').innerHTML=tmpImg?`<img src="${tmpImg}">`:`${I('image',32)}<b>Upload food photo</b><small>Tap to choose from gallery or camera</small>`;
  $('#imgRm').classList.toggle('hidden',!tmpImg);
}
function pickImg(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const M=480,s=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    tmpImg=c.toDataURL('image/jpeg',.78);drawImgPick();
  };im.onerror=()=>toast('Could not read this image','err');im.src=r.result};
  r.readAsDataURL(f);
}
function saveItem(id){
  const name=$('#fName').value.trim(),price=parseFloat($('#fPrice').value),code=$('#fCode').value.trim();
  if(!name)return toast('Enter food name','err');
  if(!(price>=0)||$('#fPrice').value==='')return toast('Enter a valid price','err');
  if(code&&S.items.some(i=>i.code===code&&i.id!==id))return toast(`Code ${code} is already used`,'err');
  const data={name,code,price:r2(price),cat:$('#fCat').value,veg:$('#fVeg .on').dataset.v==='1',track:$('#fTrack').checked,
    stock:Math.max(0,parseInt($('#fStock').value)||0),low:Math.max(0,parseInt($('#fLow').value)||0),active:$('#fActive').checked,img:tmpImg};
  if(id){const it=S.items.find(x=>x.id===id);
    if(it.track&&data.track&&it.stock!==data.stock)logInv(it.name,data.stock-it.stock,'Edited in menu');
    if(it.price!==data.price)act(`Changed price of ${it.name}: ${money(it.price)} → ${money(data.price)}`);
    Object.assign(it,data)}
  else{S.items.push({id:uid(),...data});act(`Added menu item ${name} (${money(data.price)})`)}
  if(!DB.set('items',S.items))return;
  closeModal();toast(id?'Item updated':'Item added','ok');renderShell();drawMenuGrid();
}
function delItem(id){const it=S.items.find(x=>x.id===id);confirmDlg('Delete item?',`<b>${esc(it.name)}</b> will be removed from the menu. Old bills are not affected.`,()=>{S.items=S.items.filter(x=>x.id!==id);cart=cart.filter(c=>c.id!==id);saveCart();save('items');act(`Deleted menu item ${it.name}`);toast('Item deleted','ok');drawMenuGrid()})}
function priceModal(){
  openModal('Bulk price update',`<p class="muted" style="font-size:13px;margin-bottom:14px">Increase or decrease prices for a whole category at once (e.g. +10% on Biryani).</p>
    <div class="field"><label>Category</label><select class="input" id="bpCat"><option value="all">All items</option>${S.categories.map(c=>`<option value="${c.id}">${c.emoji} ${esc(c.name)}</option>`).join('')}</select></div>
    <div class="grid2"><div class="field"><label>Change</label><input class="input" id="bpVal" type="number" step="any" placeholder="e.g. 10 or -5" autofocus></div>
    <div class="field"><label>Type</label><select class="input" id="bpType"><option value="%">Percent (%)</option><option value="₹">Rupees (₹)</option></select></div></div>
    <label class="check"><input type="checkbox" id="bpRound" checked> Round to nearest ₹5</label>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="applyBulk()">Apply</button>`,{sm:true});
}
function applyBulk(){
  const v=parseFloat($('#bpVal').value),cat=$('#bpCat').value,t=$('#bpType').value,rnd=$('#bpRound').checked;
  if(!v)return toast('Enter a value','err');
  const list=S.items.filter(i=>cat==='all'||i.cat===cat);
  list.forEach(i=>{let p=t==='%'?i.price*(1+v/100):i.price+v;if(rnd)p=Math.round(p/5)*5;i.price=Math.max(0,r2(p))});
  save('items');act(`Bulk price change ${v>0?'+':''}${v}${t} on ${cat==='all'?'all items':catOf(cat).name} (${list.length} items)`);
  closeModal();toast(`${list.length} prices updated`,'ok');PAGES.menu();
}
function renderCatList(){
  $('#menuBody').innerHTML=S.categories.length?`<div class="card p0">${tbl([['Category'],['Items','r'],['Actions','r']],
    S.categories.map((c,i)=>`<tr><td><div style="display:flex;align-items:center;gap:12px"><div class="rank" style="font-size:18px;width:38px;height:38px;background:var(--primary-50)">${c.emoji}</div><b>${esc(c.name)}</b></div></td><td class="r">${S.items.filter(x=>x.cat===c.id).length}</td>
    <td><div class="acts"><button class="icon-btn sm" title="Move up" onclick="moveCat(${i},-1)" ${i?'':'disabled'}>↑</button><button class="icon-btn sm" title="Move down" onclick="moveCat(${i},1)" ${i<S.categories.length-1?'':'disabled'}>↓</button><button class="icon-btn sm" onclick="catModal('${c.id}')">${I('edit',16)}</button><button class="icon-btn sm danger" onclick="delCat('${c.id}')">${I('trash',16)}</button></div></td></tr>`).join(''))}</div>`
    :`<div class="card empty">${I('layers',40)}<p>No categories</p></div>`;
}
function moveCat(i,d){const a=S.categories;[a[i],a[i+d]]=[a[i+d],a[i]];save('categories');renderCatList()}
const EMOJIS=['🍳','🍛','🍲','🍜','🥘','🍗','🍖','🐟','🦐','🥗','🫓','🍞','🥪','🍔','🍕','🍟','🌯','☕','🍵','🥤','🧃','🍨','🍰','🍮','🍩','🥟','🍚','🌶️'];
function catModal(id){
  const c=id?catOf(id):{name:'',emoji:'🍽️'};tmpEmoji=c.emoji;
  openModal(id?'Edit Category':'Add Category',`
    <div class="field"><label>Category name *</label><input class="input" id="cName" value="${esc(c.name)}" placeholder="e.g. Tandoori" autofocus></div>
    <div class="field"><label>Icon</label><div class="emoji-row">${EMOJIS.map(e=>`<button type="button" class="${e===tmpEmoji?'on':''}" onclick="tmpEmoji='${e}';this.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===this))">${e}</button>`).join('')}</div></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveCat('${id||''}')">Save</button>`,{sm:true});
}
function saveCat(id){
  const name=$('#cName').value.trim();if(!name)return toast('Enter category name','err');
  if(S.categories.some(c=>c.name.toLowerCase()===name.toLowerCase()&&c.id!==id))return toast('Category already exists','err');
  if(id)Object.assign(catOf(id),{name,emoji:tmpEmoji});else S.categories.push({id:uid(),name,emoji:tmpEmoji});
  save('categories');closeModal();toast('Category saved','ok');if(cur==='menu')PAGES.menu();
}
function delCat(id){
  const n=S.items.filter(x=>x.cat===id).length;
  if(n)return toast(`Move or delete the ${n} items in this category first`,'err');
  confirmDlg('Delete category?','This category will be removed.',()=>{S.categories=S.categories.filter(c=>c.id!==id);if(P.cat===id)P.cat='all';save('categories');PAGES.menu()});
}

function logInv(name,change,note){S.invlog.unshift({t:Date.now(),name,change,note,by:me()?.name||''});S.invlog=S.invlog.slice(0,500);save('invlog')}
PAGES.inventory=function(){
  const tracked=S.items.filter(i=>i.track),li=lowItems(),lm=lowMats();
  $('#view').innerHTML=`
  <div class="page-head"><div><h2>Inventory</h2><p>Track menu stock and raw materials · sold items are deducted automatically</p></div>
    <div class="actions">${IV.tab==='raw'?`<button class="btn btn-primary" onclick="matModal()">${I('plus',16)} Add Material</button>`:''}</div></div>
  <div class="kpis">
    ${kpi('Tracked Items',tracked.length,'Menu items with stock','','box','blue')}
    ${kpi('Low / Out of stock',li.length,li.filter(i=>i.stock<=0).length+' sold out',li.length?'down':'','alert',li.length?'red':'slate')}
    ${kpi('Raw Materials',S.materials.length,'Ingredients tracked','','layers','violet')}

  if(IV.tab==='menu'){
    B.innerHTML=tbl([['Item'],['Category'],['Track'],['Stock','r'],['Alert at','r'],['Status'],['Update','r']],
    S.items.map(i=>`<tr><td><div style="display:flex;align-items:center;gap:10px"><div class="mini-thumb" style="width:34px;height:34px">${thumb(i)}</div><b>${esc(i.name)}</b></div></td><td>${esc(catOf(i.cat)?.name||'—')}</td>
      <td><label class="switch"><input type="checkbox" ${i.track?'checked':''} onchange="toggleTrack('${i.id}',this.checked)"><span></span></label></td>
      <td class="r"><b>${i.track?i.stock:'—'}</b></td><td class="r">${i.track?i.low:'—'}</td><td>${i.track?st(i.stock,i.low):'<span class="badge">Not tracked</span>'}</td>

  }else if(IV.tab==='raw'){
    B.innerHTML=S.materials.length?tbl([['Material'],['Quantity','r'],['Min level','r'],['Status'],['Actions','r']],
    S.materials.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td class="r"><b>${r2(m.qty)}</b> ${esc(m.unit)}</td><td class="r">${m.min} ${esc(m.unit)}</td><td>${st(m.qty,m.min)}</td>
    <td><div class="acts"><button class="btn btn-ghost btn-sm" onclick="stockModal('mat','${m.id}')">In / Out</button><button class="icon-btn sm" onclick="matModal('${m.id}')">${I('edit',16)}</button><button class="icon-btn sm danger" onclick="delMat('${m.id}')">${I('trash',16)}</button></div></td></tr>`).join(''))

};
function toggleTrack(id,v){const i=S.items.find(x=>x.id===id);i.track=v;save('items');renderShell();PAGES.inventory()}
function stockModal(kind,id){
  const o=kind==='item'?S.items.find(x=>x.id===id):S.materials.find(x=>x.id===id),cur0=kind==='item'?o.stock:o.qty,unit=kind==='item'?'pcs':o.unit;
  openModal(`Update stock — ${esc(o.name)}`,`
    <div class="card" style="box-shadow:none;background:var(--surface2);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center"><span class="muted">Current stock</span><b style="font-size:22px">${r2(cur0)} <small class="muted" style="font-size:13px">${esc(unit)}</small></b></div>
    <div class="field"><label>Action</label><div class="seg" id="sMode"><button type="button" class="on" data-v="in" onclick="segPick(this)">+ Stock In</button><button type="button" data-v="out" onclick="segPick(this)">− Stock Out</button><button type="button" data-v="set" onclick="segPick(this)">Set exact</button></div></div>
    <div class="field"><label>Quantity (${esc(unit)})</label><input class="input" id="sQty" type="number" min="0" step="any" inputmode="decimal" autofocus></div>
    <div class="field"><label>Note</label><input class="input" id="sNote" placeholder="e.g. Purchase, wastage, prepared today"></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="applyStock('${kind}','${id}')">Update</button>`,{sm:true});
}
function applyStock(kind,id){
  const o=kind==='item'?S.items.find(x=>x.id===id):S.materials.find(x=>x.id===id),key=kind==='item'?'stock':'qty';
  const q=parseFloat($('#sQty').value),mode=$('#sMode .on').dataset.v;
  if(!(q>=0))return toast('Enter quantity','err');
  const before=o[key];let after=mode==='in'?before+q:mode==='out'?before-q:q;
  if(after<0)return toast('Stock cannot go below 0','err');
  if(kind==='item')after=Math.round(after);
  o[key]=r2(after);save(kind==='item'?'items':'materials');
  logInv(o.name,o[key]-before,$('#sNote').value.trim()||({in:'Stock in',out:'Stock out',set:'Stock set'}[mode]));
  closeModal();toast('Stock updated','ok');renderShell();PAGES.inventory();
}
function matModal(id){
  const m=id?S.materials.find(x=>x.id===id):{name:'',unit:'kg',qty:0,min:5};
  openModal(id?'Edit Material':'Add Raw Material',`
    <div class="field"><label>Name *</label><input class="input" id="mName" value="${esc(m.name)}" placeholder="e.g. Basmati Rice" autofocus></div>
    <div class="grid2"><div class="field"><label>Unit</label><select class="input" id="mUnit">${['kg','g','L','ml','pcs','packet','box','dozen','cylinder'].map(u=>`<option ${m.unit===u?'selected':''}>${u}</option>`).join('')}</select></div>
    <div class="field"><label>Min level (alert)</label><input class="input" id="mMin" type="number" min="0" step="any" value="${m.min}"></div></div>
    ${id?'':`<div class="field"><label>Opening quantity</label><input class="input" id="mQty" type="number" min="0" step="any" value="0"></div>`}`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveMat('${id||''}')">Save</button>`,{sm:true});
}
function saveMat(id){
  const name=$('#mName').value.trim();if(!name)return toast('Enter name','err');
  const d={name,unit:$('#mUnit').value,min:Math.max(0,parseFloat($('#mMin').value)||0)};
  if(id)Object.assign(S.materials.find(x=>x.id===id),d);
  else{const qty=Math.max(0,parseFloat($('#mQty').value)||0);S.materials.push({id:uid(),...d,qty});if(qty)logInv(name,qty,'Opening stock')}
  save('materials');closeModal();toast('Saved','ok');renderShell();PAGES.inventory();
}
function delMat(id){const m=S.materials.find(x=>x.id===id);confirmDlg('Delete material?',`<b>${esc(m.name)}</b> will be removed.`,()=>{S.materials=S.materials.filter(x=>x.id!==id);save('materials');renderShell();PAGES.inventory()})}

  }
};
function setPerm(r,k,v){S.perms[r][k]=v?1:0;save('perms');act(`${v?'Allowed':'Removed'} "${PERMS.find(p=>p[0]===k)[1]}" for ${r}`);toast(`${r}: permission updated`,'ok')}
function staffModal(id){
  const s=id?S.staff.find(x=>x.id===id):{name:'',role:'Cashier',pin:'',phone:'',active:true};
  openModal(id?'Edit Staff':'Add Staff',`
    <div class="field"><label>Full name *</label><input class="input" id="stName" value="${esc(s.name)}" autofocus></div>
    <div class="grid2"><div class="field"><label>Role *</label><select class="input" id="stRole">${ROLES.map(r=>`<option ${s.role===r?'selected':''}>${r}</option>`).join('')}</select></div>
    <div class="field"><label>Phone</label><input class="input" id="stPhone" inputmode="tel" value="${esc(s.phone)}"></div></div>
    <div class="field"><label>4-digit login PIN *</label><input class="input" id="stPin" inputmode="numeric" maxlength="4" value="${esc(s.pin)}" placeholder="••••"><small>Each staff member needs a unique PIN</small></div>
    <label class="check"><input type="checkbox" id="stActive" ${s.active?'checked':''}> Active (can log in)</label>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveStaff('${id||''}')">Save</button>`,{sm:true});
}
function saveStaff(id){
  const d={name:$('#stName').value.trim(),role:$('#stRole').value,phone:$('#stPhone').value.trim(),pin:$('#stPin').value.trim(),active:$('#stActive').checked};
  if(!d.name)return toast('Enter name','err');
  if(!/^\d{4}$/.test(d.pin))return toast('PIN must be exactly 4 digits','err');
  if(S.staff.some(s=>s.pin===d.pin&&s.id!==id))return toast('PIN already used by another staff','err');
  if(!S.staff.some(s=>s.role==='Admin'&&s.active&&s.id!==id)&&(d.role!=='Admin'||!d.active))return toast('At least one active Admin is required','err');
  if(id)Object.assign(S.staff.find(x=>x.id===id),d);else S.staff.push({id:uid(),...d});
  act(`${id?'Updated':'Added'} staff ${d.name} (${d.role})`);
  save('staff');closeModal();toast('Staff saved','ok');
  if(!me())return logout();
  renderShell();if(!can('staff'))return go(NAV.find(n=>can(n.perm))?.id||'pos');PAGES.staff();
}
function delStaff(id){
  const s=S.staff.find(x=>x.id===id);
  if(s.role==='Admin'&&S.staff.filter(x=>x.role==='Admin'&&x.active).length<=1)return toast('Cannot delete the only Admin','err');
  confirmDlg('Remove staff?',`<b>${esc(s.name)}</b> will no longer be able to log in. Their old bills are kept.`,()=>{S.staff=S.staff.filter(x=>x.id!==id);save('staff');act(`Removed staff ${s.name}`);PAGES.staff()});
}

/* =========================================================
   SETTINGS
========================================================= */
PAGES.settings=function(){
  const s=S.settings;
  let used=0;for(let k in localStorage)if(k.startsWith(LS))used+=(localStorage.getItem(k)||'').length*2;
  const mb=used/1048576,pct=Math.min(100,mb/5*100);
  const chk=(id,v,l,sub='')=>`<label class="check"><input type="checkbox" id="${id}" ${v?'checked':''}><span>${l}${sub?`<br><small class="muted" style="font-weight:400">${sub}</small>`:''}</span></label>`;
  $('#view').innerHTML=`
  <div class="page-head"><div><h2>Settings</h2><p>Hotel details, tax, charges, printer, UPI and data backup</p></div>
    <div class="actions"><button class="btn btn-primary" onclick="saveSettings()">${I('check',16)} Save Changes</button></div></div>
  <div class="dash-grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
    <div class="card"><div class="card-h"><h3>Hotel Details</h3><span class="muted">Printed on the bill</span></div>
      <div class="field"><label>Hotel / Restaurant name</label><input class="input" id="sName" value="${esc(s.name)}"></div>
      <div class="field"><label>Address</label><textarea class="input" id="sAddr" rows="2">${esc(s.address)}</textarea></div>
      <div class="grid2"><div class="field"><label>Phone</label><input class="input" id="sPhone" value="${esc(s.phone)}"></div>
      <div class="field"><label>GSTIN</label><input class="input" id="sGstin" value="${esc(s.gstin)}" placeholder="Optional"></div></div>
      <div class="field"><label>Bill footer message</label><input class="input" id="sFooter" value="${esc(s.footer)}"></div>
    </div>
    <div class="card"><div class="card-h"><h3>Tax &amp; Charges</h3></div>
      <div class="grid2"><div class="field"><label>GST %</label><select class="input" id="sGst">${[0,5,12,18].map(g=>`<option value="${g}" ${+s.gst===g?'selected':''}>${g===0?'No GST':g+'%'}</option>`).join('')}</select><small>Printed as CGST + SGST</small></div>
      <div class="field"><label>Number of tables</label><input class="input" id="sTables" type="number" min="0" max="200" value="${s.tables}"></div></div>
      <div class="grid2"><div class="field"><label>Service charge % (Dine-in)</label><input class="input" id="sSvc" type="number" min="0" step="any" value="${s.svc}"></div>
      <div class="field"><label>Packing charge ₹ (Parcel)</label><input class="input" id="sPack" type="number" min="0" step="any" value="${s.pack}"></div></div>
      <div class="grid2"><div class="field"><label>Bill number prefix</label><input class="input" id="sPrefix" value="${esc(s.prefix)}"></div>
      <div class="field"><label>Next bill number</label><input class="input" id="sNext" type="number" min="1" value="${s.next}"></div></div>
    </div>
    <div class="card"><div class="card-h"><h3>Printer &amp; KOT</h3></div>
      <div class="field"><label>Bill paper size</label><select class="input" id="sPaper"><option value="80" ${s.paper==='80'?'selected':''}>3 inch (80 mm) — recommended</option><option value="58" ${s.paper==='58'?'selected':''}>2 inch (58 mm)</option></select></div>
      ${chk('sKot',s.kotOnHold,'Print KOT automatically when holding an order','Only new items are sent to the kitchen')}
      ${chk('sNotes',s.notesOnBill,'Show item notes on customer bill')}
      <button class="btn btn-ghost" onclick="testPrint()">${I('printer',16)} Test Print</button>
      <p class="muted" style="font-size:12px;margin-top:12px;line-height:1.6">In the print dialog choose your thermal printer, set <b>Margins: None</b> and turn off <b>Headers and footers</b>. Tick “Silent printing” in your browser/kiosk setup for one-tap printing.</p>
    </div>
    <div class="card"><div class="card-h"><h3>UPI Payments</h3><span class="badge violet">${I('qr',12)} QR</span></div>
      <div class="field"><label>UPI ID</label><input class="input" id="sUpi" value="${esc(s.upiId)}" placeholder="e.g. hotelname@okaxis"></div>
      <div class="field"><label>Payee name</label><input class="input" id="sUpiName" value="${esc(s.upiName)}" placeholder="${esc(s.name)}"></div>
      ${chk('sQr',s.qrOnBill,'Print UPI QR on bill','On draft bills and UPI bills, with the exact amount')}
      <button class="btn btn-ghost" onclick="S.settings.upiId=$('#sUpi').value.trim();S.settings.upiName=$('#sUpiName').value.trim();showQR(1,'Test')">${I('qr',16)} Preview QR (₹1)</button>
    </div>
    <div class="card"><div class="card-h"><h3>Backup &amp; Restore</h3></div>
      <p class="muted" style="font-size:13px;margin-bottom:12px">Data is stored in this browser on this device. Download a backup every day.</p>
      <div style="display:flex;justify-content:space-between;font-size:12.5px"><span class="muted">Storage used</span><b>${mb.toFixed(2)} MB of ~5 MB</b></div>
      <div class="prog" style="margin-bottom:16px"><i style="width:${pct}%;background:${pct>80?'var(--red)':'var(--green)'}"></i></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-dark" onclick="backup()">${I('download',16)} Download Backup</button>
      <button class="btn btn-ghost" onclick="$('#restoreFile').click()">${I('upload',16)} Restore</button><input type="file" id="restoreFile" accept=".json" hidden onchange="restore(this)"></div>
    </div>
    <div class="card" style="border-color:rgba(220,38,38,.35)"><div class="card-h"><h3 style="color:var(--red)">Danger Zone</h3></div>
      <p class="muted" style="font-size:13px;margin-bottom:12px">Delete only sales history, or reset everything back to the starting demo data.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-ghost" style="color:var(--red)" onclick="clearBills()">Clear all bills</button><button class="btn btn-danger" onclick="resetAll()">Reset everything</button></div>
    </div>
  </div>`;
};
function saveSettings(){
  const name=$('#sName').value.trim();if(!name)return toast('Hotel name is required','err');
  Object.assign(S.settings,{name,address:$('#sAddr').value.trim(),phone:$('#sPhone').value.trim(),gstin:$('#sGstin').value.trim(),footer:$('#sFooter').value.trim(),
    gst:+$('#sGst').value,paper:$('#sPaper').value,prefix:$('#sPrefix').value.trim(),next:Math.max(1,parseInt($('#sNext').value)||1),
    tables:Math.min(200,Math.max(0,parseInt($('#sTables').value)||0)),svc:Math.max(0,+$('#sSvc').value||0),pack:Math.max(0,+$('#sPack').value||0),
    kotOnHold:$('#sKot').checked,notesOnBill:$('#sNotes').checked,upiId:$('#sUpi').value.trim(),upiName:$('#sUpiName').value.trim(),qrOnBill:$('#sQr').checked});
  save('settings');act('Updated hotel settings');renderShell();toast('Settings saved','ok');
}
function testPrint(){const g=+S.settings.gst||0,tax=r2(180*g/100);printBill({no:'TEST-001',t:Date.now(),items:[{name:'Masala Dosa',price:70,qty:2},{name:'Filter Coffee',price:20,qty:2}],sub:180,disc:0,gst:g,tax,round:r2(Math.round(180+tax)-(180+tax)),total:Math.round(180+tax),pay:'UPI',type:'Dine-in',table:'5',cust:'',phone:'',staff:me().name})}
function backup(){download(`hotel-backup-${dkey(Date.now())}.json`,JSON.stringify({app:'hotelpos',v:2,at:Date.now(),data:S}),'application/json');act('Downloaded backup')}
function restore(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(String(r.result).replace(/^﻿/,''));if(j.app!=='hotelpos'||!j.data?.settings)throw 0;
    confirmDlg('Restore backup?',`Backup from <b>${fmtDT(j.at)}</b>. All current data on this device will be replaced.`,()=>{KEYS.forEach(k=>{if(j.data[k])DB.set(k,j.data[k])});location.reload()},'Restore',false)}
    catch(e){toast('Invalid backup file','err')}};
  r.readAsText(f);
}
function clearBills(){confirmDlg('Clear all bills?','Every bill and sales report will be permanently deleted. Download a backup first.',()=>{S.bills=[];save('bills');act('Cleared all bills');toast('All bills cleared','ok')},'Delete all bills')}
function resetAll(){confirmDlg('Reset everything?','All menu items, photos, staff, stock, customers, expenses and bills will be erased and replaced with demo data.',()=>{Object.keys(localStorage).filter(k=>k.startsWith(LS)&&k!==LS+'theme').forEach(k=>localStorage.removeItem(k));sessionStorage.clear();location.reload()},'Reset')}

/* =========================================================
   Boot
========================================================= */
window.addEventListener('afterprint',()=>{$('#printArea').innerHTML=''});
load();applyTheme();
if(me())startApp();else renderLogin();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
